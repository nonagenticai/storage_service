[project]
name = "storage-service"
version = "1.1.0"
description = "Centralized MinIO storage API with ClamAV virus scanning"
authors = [
    {name = "George Dekker"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "minio>=7.2.9",
    "python-multipart>=0.0.31",
    "clamd>=1.0.2",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
    "cachetools>=6.2.4",
    "cryptography>=50.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
contract = [
    "schemathesis>=3.36.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.12.0",
    "PyJWT[crypto]>=2.15.1",
    "httpx>=0.27.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.23",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "PyJWT[crypto]>=2.15.1",
    "httpx>=0.27.0",
    "detect-secrets>=1.5.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: tests that hit live services",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"
